[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triageai"
version = "0.1.0"
description = "Production-oriented agent harness for IT ticket triage: classification, retrieval-grounded drafting, and confidence-based routing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=0.1.5",
    "langchain-core>=0.2",
    "chromadb>=0.5",
    "neo4j>=5.20",
    "structlog>=24.1",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=0.1"]
openai = ["langchain-openai>=0.1"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "eval"]
markers = [
    "integration: requires external services (Neo4j, Ollama) to be running",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["triageai"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true
